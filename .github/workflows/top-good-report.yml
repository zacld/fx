name: Top 20 good leads report

# Read-only: the Good leads tab's Top 20 worked out from the site's private store exactly as the page does it
# (apps/web/scripts/top-good-report.mjs), for a report to the coding session. The repo is public, so the report is
# printed only encrypted to the public key in apps/web/scripts/report-key.pem — the log shows counts and ciphertext,
# never a company or a person; a run off main also commits that ciphertext to its own branch for the session to pull
# (top-good-report.enc, deleted once read). On a push of these files, or by hand.

on:
  push:
    paths:
      - .github/workflows/top-good-report.yml
      - apps/web/scripts/top-good-report.mjs
      - apps/web/scripts/report-key.pem
  workflow_dispatch:

permissions:
  contents: write   # a run off main commits the encrypted report to its own branch (the session pulls it, then deletes it)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STORE_READ_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --workspace apps/web --no-audit --no-fund > /dev/null
      - name: The Top 20, encrypted
        working-directory: apps/web
        run: node scripts/top-good-report.mjs scripts/report-key.pem ../top-good-report.enc
      - name: Hand the encrypted report to the session (its own branch only, never main)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-good-report.enc
          git commit -q -m "Top 20 report (encrypted) for the coding session — deleted once read"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
