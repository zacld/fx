name: Niche Finder — Deploy to GitHub Pages

# Deploys the static niche-finder dashboard to GitHub Pages.
#
# The committed dashboard/data/niches.json already contains real competition
# scores from the last local run. The workflow serves that data as-is by default.
#
# If GEMINI_API_KEY or ANTHROPIC_API_KEY is set in repo secrets, the workflow
# will also run a competition recheck for stale niches (> 30 days old) and
# serve the freshened data.
#
# GitHub Pages must be enabled: Repo → Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'niche-finder/**'
      - '.github/workflows/niche-finder-pages.yml'
  workflow_dispatch:
    # Manual trigger. Set GEMINI_API_KEY in repo secrets to refresh competition scores.

concurrency:
  group: niche-finder-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Refresh competition scores (if API key is set)
        # Only installs Python and runs the recheck when a key is available.
        # Otherwise the committed dashboard/data/niches.json is used unchanged.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "API key found — refreshing stale competition scores…"
            pip install -r niche-finder/requirements.txt -q
            cd niche-finder
            # Recheck works on the existing committed JSON, then copies result to dashboard/data/
            python main.py --recheck-competition --older-than-days 30 --out niche_finder
          else
            echo "No API key — serving committed competition data (has real scores from last local run)."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: niche-finder/dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
