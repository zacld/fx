name: FX Evergreen Discovery

# Public repo: anyone can read this workflow's logs, so print counts and company names only, never people's
# names, emails or phones, and attach no files that hold them. Keys stay in secrets.

# Weekly job that discovers high-fit UK importers/distributors independently of
# daily news flow. Runs the evergreen playbook (wine/spirits, food, machinery,
# chemicals, packaging, furniture, textiles, automotive, electronics, logistics)
# through the same website-validation and scoring pipeline as the daily run.
#
# Adds a rolling pool of ~50-200 validated evergreen_saving leads per week.
# These feed into the daily READY ranking and gain freshness bonus when first found.
#
# Required secrets: same as discovery.yml (GROQ not needed — no AI calls here).

on:
  schedule:
    - cron: '0 2 * * 0'   # 2am Sunday UTC — before the working week, plenty of time
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run evergreen even if this week's events already exist"
        required: false
        default: "false"


# One run at a time reads and writes the leads store; a second run waits for the first.
concurrency:
  group: fx-leads-store
  cancel-in-progress: false

jobs:
  evergreen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace deps
        run: npm ci

      # The leads (director names, phones, emails) live in the site's private store behind the Accounts
      # password, not in git. A run without them would overwrite the store with only today's finds, so it stops.
      - name: Fetch the leads from the private store
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        # Fails (exit 3) when the store is empty: stop rather than start the leads again from nothing.
        run: node apps/web/scripts/leads-store.mjs get data/leads.json

      - name: Run evergreen pipeline (insert playbook events → discover → enrich → score → export)
        # Capped below the job's limit and allowed to fail, so the leads are still saved to the store after a
        # slow or stuck run (the store would otherwise lose everything since the last save).
        timeout-minutes: 60
        continue-on-error: true
        env:
          BRAVE_API_KEY:                 ${{ secrets.BRAVE_API_KEY }}
          COMPANIES_HOUSE_API_KEY:      ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          FX_SMTP_DISABLE:              "1"
          FX_HOST_MIN_INTERVAL_MS:      "800"
          # Decision-maker lookups stop starting new leads after 35 minutes (saved; the next run
          # carries on) and give up on one slow site after 2 minutes, so score / dedup / export always run.
          FX_DM_BUDGET_MIN:             "35"
          FX_DM_LEAD_TIMEOUT_S:         "120"
          # Website intel likewise: 15 minutes, 90 seconds a site; a site read is left 14 days.
          FX_INTEL_BUDGET_MIN:          "15"
          FX_INTEL_LEAD_TIMEOUT_S:      "90"
          FX_EMAIL_VERIFIER_URL:        ${{ secrets.FX_EMAIL_VERIFIER_URL }}
          FX_EMAIL_VERIFIER_TOKEN:      ${{ secrets.FX_EMAIL_VERIFIER_TOKEN }}
          GOOGLE_SHEET_ID:              ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_TAB:             ${{ vars.GOOGLE_SHEET_TAB }}
          EVERGREEN_FORCE:              ${{ inputs.force }}
        run: |
          # One deadline for the whole step (its limit is 60 min): the slow stages stop early enough
          # that score / dedup / export always finish inside it.
          export FX_PIPELINE_DEADLINE=$(( $(date +%s) + 55 * 60 ))
          npm run pipeline:evergreen

      - name: Refresh dashboard snapshot
        run: npm run sync-web-data

      - name: Save the leads to the private store
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node apps/web/scripts/leads-store.mjs put data/leads.json

      - name: Commit updated data
        run: |
          git config user.name  "FX Discovery Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json apps/web/public/data/events.json   # leads: private store only
          git diff --staged --quiet || git commit -m "data: evergreen update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git checkout -- .
          git pull --rebase origin main
          git push
