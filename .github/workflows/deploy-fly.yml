name: Deploy Dashboard to Fly.io

# Public repo: anyone can read this workflow's logs, so print counts and company names only, never people's
# names, emails or phones, and attach no files that hold them. Keys stay in secrets.

# Mirrors the GitHub Pages workflow: redeploy the Fly-hosted dashboard whenever
# code changes (push to main) or the discovery pipeline commits new data.
#
# Requires repo secret FLY_API_TOKEN — create it with:
#   flyctl tokens create deploy --name github-actions
# then add it under: repo → Settings → Secrets and variables → Actions
# Until that secret is set this job will fail (authentication error) — that's the
# only thing it needs.

# Manual only for now: without FLY_API_TOKEN every automatic run failed (690 runs), each costing Actions
# minutes. Put the push / workflow_run triggers back once the secret is set.
on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN secret not set — skipping Fly deploy."
            echo "Create it with: flyctl tokens create deploy --name github-actions"
            echo "then add it under repo Settings → Secrets and variables → Actions."
            exit 0
          fi
          flyctl deploy --remote-only --ha=false
