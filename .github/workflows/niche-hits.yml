name: Niche hits
# (and lead ranking: every company the Accounts and FX filings lists hold gets its niche, sector codes and an absurd
# check — banks, insurers, funds, FX providers, public bodies, not-for-profits, dissolved — then every lead is scored
# with the Accounts page's lead score, apps/web/scripts/rank-leads.mjs, saved as leads/ranked for the page.)

# How good each niche is, measured (lead-sourcer/tools/niche_hits.py): for every niche — sector niches and goods niches
# (what HMRC's customs lists show companies importing) — and every customs heading, how many full / medium / group
# accounts companies are in it, how many show strong FX proof in their own filings, and how many of those name no
# forwards or FX provider (still open). Saved to the site's private store (key niches/stats): the finder checks the
# best niches first and skips poor ones. Weekly, and when the tool or the niches change (a measurement, so those runs
# save too). The log holds counts, niche names and customs headings only (public repo).

on:
  schedule:
    - cron: '23 4 * * *'     # every morning: after the evening finder run, before the day
  workflow_dispatch:
  push:
    branches: ['main', 'claude/**']
    paths:
      - .github/workflows/niche-hits.yml
      - lead-sourcer/tools/niche_hits.py
      - lead-sourcer/sourcer/niches.py
      - lead-sourcer/config/fx_niches.json
      - lead-sourcer/sourcer/absurd.py
      - lead-sourcer/sourcer/owners.py
      - lead-sourcer/tools/psc_deals.py
      - apps/web/scripts/rank-leads.mjs
      - apps/web/src/accounts/ranking.js

concurrency:
  group: niche-hits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  niches:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The finder's monthly copies of Companies House's bulk file and HMRC's trader files, when there are some.
      - name: Restore the Companies House bulk file
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/fx-lead-sourcer/BasicCompanyData*.zip
          key: ch-bulk-v2-${{ steps.month.outputs.month }}
          restore-keys: ch-bulk-v2-
      - name: Restore the HMRC trader files
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/fx-lead-sourcer/hmrc
          key: hmrc-v2-${{ steps.month.outputs.month }}
          restore-keys: |
            hmrc-v2-
            hmrc-traders-
      - name: The FX filings list and every tracked company
        run: |
          npm ci --workspace apps/web --no-audit --no-fund > /dev/null
          cd apps/web && node scripts/filings-store.mjs get ../../lead-sourcer/fx-filings.json
          node scripts/alerts-store.mjs tracked ../../lead-sourcer/tracked.json
      - name: Measure the niches
        working-directory: lead-sourcer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          zip=$(ls -t ~/.cache/fx-lead-sourcer/BasicCompanyData*.zip 2>/dev/null | head -1 || true)
          python3 tools/niche_hits.py --filings fx-filings.json --out niche_stats.json --tracked tracked.json \
            --enrich-out enrich.json --traders-out traders.json ${zip:+--bulk "$zip"}
      # Who bought whom in the last 120 days (Companies House's free daily ownership snapshot, ~2.6GB): private-equity
      # buyouts, employee ownership trusts, overseas buyers, and UK companies buying subsidiaries — kept with an FX sign.
      - name: Deals from the ownership register
        working-directory: lead-sourcer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          zip=$(ls -t ~/.cache/fx-lead-sourcer/BasicCompanyData*.zip 2>/dev/null | head -1 || true)
          python3 tools/psc_deals.py --tracked tracked.json --traders traders.json --out deals.json --groups-out groups.json ${zip:+--bulk "$zip"}
      - name: Save
        run: |
          cd apps/web && node scripts/alerts-store.mjs put niches ../../lead-sourcer/niche_stats.json
          node scripts/alerts-store.mjs put deals ../../lead-sourcer/deals.json
      - name: Rank every lead
        run: cd apps/web && node scripts/rank-leads.mjs ../../lead-sourcer/enrich.json ../../lead-sourcer/lead_order.json ../../lead-sourcer/groups.json
      # Every lead's own website (best leads first), confirmed by its company number or registered name on the site:
      # what Cognism, Zint and a quick Google match a company on. Found sites are kept; ~40 minutes a day until done.
      - name: Websites
        run: |
          cd apps/web && (node scripts/alerts-store.mjs get domains ../../lead-sourcer/domains_cache.json || echo '{}' > ../../lead-sourcer/domains_cache.json)
          cd ../../lead-sourcer && PYTHONUNBUFFERED=1 python3 tools/find_domains.py --tracked tracked.json --order lead_order.json --cache domains_cache.json --out domains.json --groups groups.json --budget 2400
          cd ../apps/web && node scripts/alerts-store.mjs put domains ../../lead-sourcer/domains.json
