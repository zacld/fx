name: PSC probe
# One-off: the shape of Companies House's free PSC snapshot (lead-sourcer/tools/psc_probe.py). Structure only.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [.github/workflows/psc-probe.yml, lead-sourcer/tools/psc_probe.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 lead-sourcer/tools/psc_probe.py
