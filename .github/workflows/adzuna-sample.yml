name: Adzuna sample

# Are Adzuna's job adverts worth wiring in? One search each for the strongest companies on the Recent FX filings list
# (lead-sourcer/tools/adzuna_sample.py): hard cap of 50 calls a run, 3 seconds apart. Runs when the tool or this file
# changes. Keys from the GitHub secrets ADZUNA_APP_ID / ADZUNA_APP_KEY (never logged). Public repo: the log holds
# company names, advert titles and counts only.

on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/**']
    paths:
      - .github/workflows/adzuna-sample.yml
      - lead-sourcer/tools/adzuna_sample.py

permissions:
  contents: read

concurrency:
  group: adzuna-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The FX filings list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm ci --workspace apps/web --no-audit --no-fund > /dev/null
          cd apps/web && node scripts/filings-store.mjs get ../../lead-sourcer/fx-filings.json
      - name: Search Adzuna (50 calls at most)
        working-directory: lead-sourcer
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 tools/adzuna_sample.py fx-filings.json
