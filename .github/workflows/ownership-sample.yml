# Who owns the best 30 leads: the accounts, the Global LEI register (free daily files) and Companies House side by side,
# printed for checking by hand. Read-only: nothing saved. Runs on a push of these files, or by hand.
name: Ownership sample
on:
  workflow_dispatch:
    inputs:
      count:
        description: How many of the best leads
        default: "30"
  push:
    paths:
      - apps/web/scripts/ownership-sample.mjs
      - lead-sourcer/sourcer/gleif.py
      - lead-sourcer/tools/gleif_owners.py
      - lead-sourcer/sourcer/owner_search.py
      - lead-sourcer/tools/owner_search.py
      - lead-sourcer/tools/parents_from_accounts.py
      - .github/workflows/ownership-sample.yml
concurrency:
  group: ownership-sample
  cancel-in-progress: true
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Tracked companies
        run: |
          npm ci --workspace apps/web --no-audit --no-fund > /dev/null
          cd apps/web && node scripts/alerts-store.mjs tracked ../../lead-sourcer/tracked.json
      - name: Owners from the LEI register
        working-directory: lead-sourcer
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 tools/gleif_owners.py --tracked tracked.json --out gleif.json
      # the web search for the sample's companies (kept in the store's owner-search item, as the daily run does)
      - name: Who owns them — web search
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          SEARCH1API_KEY: ${{ secrets.SEARCH1API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Gemini + Google Search: one call a company
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API }}   # the AI reader: one call a company, capped by --max
        run: |
          cd apps/web && (node scripts/alerts-store.mjs get owners ../../lead-sourcer/owners_cache.json || echo '{}' > ../../lead-sourcer/owners_cache.json)
          NUMBERS=$(node scripts/ownership-sample.mjs ../../lead-sourcer/gleif.json "${{ github.event.inputs.count || '30' }}" --numbers | tail -1)
          cd ../../lead-sourcer && (cd ../apps/web && node scripts/alerts-store.mjs get parents ../../lead-sourcer/parents_cache.json || echo '{}' > ../../lead-sourcer/parents_cache.json)
          COMPANIES_HOUSE_API_KEY="${{ secrets.COMPANIES_HOUSE_API_KEY }}" python3 tools/parents_from_accounts.py --tracked tracked.json --cache parents_cache.json --out parents.json --numbers "$NUMBERS"
          (cd ../apps/web && node scripts/alerts-store.mjs put parents ../../lead-sourcer/parents.json)
          python3 tools/owner_search.py --tracked tracked.json --cache owners_cache.json --out owners.json --numbers "$NUMBERS" --parents parents.json
          cd ../apps/web && node scripts/alerts-store.mjs put owners ../../lead-sourcer/owners.json
      - name: The best leads, side by side
        run: cd apps/web && node scripts/ownership-sample.mjs ../../lead-sourcer/gleif.json "${{ github.event.inputs.count || '30' }}" ../../lead-sourcer/owners.json
