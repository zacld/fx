name: FX Discovery

# Daily v2 pipeline (TypeScript monorepo). Imports the committed data/*.json into
# a throwaway SQLite DB, runs every stage, exports the DB back out to data/*.json,
# refreshes the dashboard snapshot, and commits the result. The deploy workflows
# (GitHub Pages / Fly) redeploy the dashboard after this completes.
#
# Required repo secrets:
#   GROQ_API_KEY              (the one AI provider — analyse stage; falls back to a
#                              rule-based event on 429, so a missing key degrades
#                              gracefully rather than failing the run)
#   COMPANIES_HOUSE_API_KEY   (CH validation in discover; optional — discovery still
#                              works from website evidence without it)
# Optional: GROQ_MODEL, GEMINI_API_KEY, GEMINI_MODEL (only if AI_PROVIDER=gemini).

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6am Mon–Fri UTC
  workflow_dispatch:          # manual trigger from the Actions UI

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Run the v2 pipeline (import → analyse → discover → enrich-contacts → enrich-decision-makers → enrich-website-intel → score → dedup → export)
        env:
          AI_PROVIDER:                  groq
          GROQ_API_KEY:                 ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:                   ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY:               ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:                 ${{ secrets.GEMINI_MODEL }}
          COMPANIES_HOUSE_API_KEY:      ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          DISCOVERY_MAX_EVENTS:         "12"
          WEB_MAX_EVENTS:               "5"
          WEB_MAX_CATEGORIES_TO_SCRAPE: "6"
          CATEGORY_MIN_SCORE_TO_SCRAPE: "65"
          # Port 25 is blocked from GitHub Actions egress, so the SMTP RCPT
          # probe in enrich-decision-makers can't connect. The verifier falls
          # back to MX-only checking; verified results from local runs still
          # serve from data/cache/smtp.json when present.
          FX_SMTP_DISABLE:              "1"
          # Per-host fetch politeness — 6 concurrent leads × multiple stages
          # would otherwise hammer the same domain.
          FX_HOST_MIN_INTERVAL_MS:      "800"
          # Optional: set FX_EMAIL_VERIFIER_URL (+ FX_EMAIL_VERIFIER_TOKEN) as
          # GitHub secrets to route verification through Hunter / Snov /
          # NeverBounce / a custom worker. When set, takes precedence over the
          # SMTP_DISABLE branch above.
          FX_EMAIL_VERIFIER_URL:        ${{ secrets.FX_EMAIL_VERIFIER_URL }}
          FX_EMAIL_VERIFIER_TOKEN:      ${{ secrets.FX_EMAIL_VERIFIER_TOKEN }}
        run: npm run pipeline

      # ── Python enrichment (runs on new/unenriched leads only — idempotent) ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests dnspython --quiet

      - name: Enrich CH accounts (size band, employee count, turnover, accounts type)
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: python3 scripts/enrich_ch_accounts.py
        continue-on-error: true

      - name: Enrich directories (multi-source phone cross-reference — Yell, Scoot, Thomson, FreeIndex, Cylex)
        run: python3 scripts/enrich_directories.py
        continue-on-error: true

      - name: Enrich decision makers (CH officers, team pages, route grade, contact confidence)
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          CI: "true"   # disables SMTP verification (port 25 blocked in Actions)
        run: python3 scripts/enrich_decision_makers.py
        continue-on-error: true   # enrichment failure should not block the commit

      - name: Enrich website intelligence (evidence snippets, country/currency inference, FX likelihood)
        run: python3 scripts/enrich_website_intelligence.py
        continue-on-error: true

      - name: Compute call readiness (READY / REVIEW / HOLD per lead)
        run: python3 scripts/compute_call_readiness.py
        continue-on-error: true

      - name: QA audit (summary printed to Actions log — non-blocking)
        run: python3 scripts/audit_leads.py || true

      - name: Refresh the dashboard data snapshot
        run: npm run sync-web-data

      - name: Commit updated data
        run: |
          git config user.name  "FX Discovery Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json data/leads.json apps/web/public/data/
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
