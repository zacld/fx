name: FX notes sample

# What the currency-note readers (lead-sourcer/sourcer/fx_notes.py) find in real accounts, and what they may miss
# (lead-sourcer/tools/fx_notes_sample.py): forward contracts, currencies named, foreign-currency balances,
# sensitivity, turnover by region. Samples an even spread of the Accounts list — only company numbers and names
# are taken from the private list, never people. Runs when this file or the tool changes (free on the public repo),
# or by hand with company numbers.
# Public repo: the log holds accounts lines only (public records, no personal names) and there are no attachments.

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: 'Company numbers, space-separated (blank: an even spread of the Accounts list)'
        required: false
      max:
        description: 'How many companies to sample from the list'
        required: false
        default: '40'
  push:
    branches: ['main', 'claude/**']
    paths:
      - .github/workflows/fx-notes-sample.yml
      - lead-sourcer/tools/fx_notes_sample.py

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools (pdftotext, OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null

      - name: Install Python packages
        run: pip install -q -r lead-sourcer/requirements.txt

      - uses: actions/setup-node@v4
        if: inputs.numbers == ''
        with:
          node-version: 22
          cache: npm

      # Company number, name and accounts type only: the list's people never leave the store.
      - name: Companies on the Accounts list
        if: inputs.numbers == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm ci --workspace apps/web --no-audit --no-fund > /dev/null
          cd apps/web && node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { openStore } from "./scripts/store.mjs";
            const data = await (await openStore("fx-accounts")).get("latest");
            const keep = ["company_number", "company_name", "accounts_category", "accounts_format", "section", "turnover_gbp", "size_basis"];
            const rows = (data?.rows || []).map((r) => Object.fromEntries(keep.filter((k) => r[k] !== undefined).map((k) => [k, r[k]])));
            writeFileSync("../../lead-sourcer/sample.json", JSON.stringify(rows));
            console.log(`${rows.length} companies on the list`);
            // Why so few finance contacts come from Companies House job titles: how many directors on the list are
            // filed with a finance occupation, and which titles (job titles and counts only — never names)
            const fin = /financ|cfo|treasur|controller|accountant|\bfd\b/i;
            const occs = (data?.rows || []).map((r) => (r.all_directors || "").split("; ")
              .map((d) => (d.match(/\(([^()]*)\)$/) || [])[1] || ""));
            const titles = {};
            occs.flat().filter((o) => fin.test(o)).forEach((o) => { titles[o] = (titles[o] || 0) + 1; });
            const fromCh = (data?.rows || []).filter((r) => /^Companies House/.test(r.finance_contact_source || "")).length;
            console.log(`companies with a director filed with a finance occupation: ${occs.filter((o) => o.some((x) => fin.test(x))).length}; ` +
                        `finance contact from a Companies House occupation: ${fromCh}`);
            console.log("finance occupations as filed: " + JSON.stringify(Object.entries(titles).sort((a, b) => b[1] - a[1]).slice(0, 25)));
            const all = {};
            occs.flat().forEach((o) => { all[o || "(blank)"] = (all[o || "(blank)"] || 0) + 1; });
            console.log(`rows with directors listed: ${(data?.rows || []).filter((r) => r.all_directors).length}; ` +
                        "most common occupations: " + JSON.stringify(Object.entries(all).sort((a, b) => b[1] - a[1]).slice(0, 15)));
          '

      - name: Sample
        working-directory: lead-sourcer
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          NUMBERS: ${{ inputs.numbers }}
          MAX: ${{ inputs.max || '40' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$NUMBERS" ]; then python3 tools/fx_notes_sample.py $NUMBERS
          else python3 tools/fx_notes_sample.py --accounts sample.json --max "$MAX"; fi
