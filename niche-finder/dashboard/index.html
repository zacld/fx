<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niche Finder — FX Exposure Rankings</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222533;
      --border: #2e3347;
      --text: #e2e6f0;
      --muted: #8892a4;
      --accent: #4f8ef7;
      --accent-dim: #2a4a8a;
      --green: #34d399;
      --yellow: #fbbf24;
      --orange: #f97316;
      --red: #f87171;
      --purple: #a78bfa;
      --stale-bg: #2d1f0a;
      --stale-border: #7c4a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    header p { color: var(--muted); font-size: 12px; }

    /* ── Layout ── */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

    /* ── Summary bar ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .stat-card .value { font-size: 24px; font-weight: 700; }

    /* ── Filters ── */
    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .filter-bar label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"] { min-width: 200px; }
    .filter-bar .reset-btn {
      margin-left: auto;
      padding: 6px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    .filter-bar .reset-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Stale banner ── */
    .stale-banner {
      background: var(--stale-bg);
      border: 1px solid var(--stale-border);
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--orange);
      display: none;
    }
    .stale-banner.visible { display: block; }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface); }
    th {
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--text); }
    th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    th.sort-asc .sort-arrow::after { content: " ↑"; opacity: 1; }
    th.sort-desc .sort-arrow::after { content: " ↓"; opacity: 1; }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }
    tbody tr.stale { background: var(--stale-bg); }
    tbody tr.stale:hover { background: #3a2810; }

    td { padding: 10px 14px; vertical-align: top; }
    td.niche-name { font-weight: 600; max-width: 220px; }
    td.notes-cell { color: var(--muted); font-size: 12px; max-width: 300px; }
    td.evidence-cell { color: var(--muted); font-size: 12px; max-width: 260px; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-competition-very_low  { background: #0d3320; color: var(--green); }
    .badge-competition-low       { background: #1a3a20; color: #6ee7b7; }
    .badge-competition-moderate  { background: #2d2a10; color: var(--yellow); }
    .badge-competition-high      { background: #2d1a10; color: var(--orange); }
    .badge-competition-very_high { background: #2d1010; color: var(--red); }
    .badge-competition-          { background: var(--surface2); color: var(--muted); }

    .badge-strength-confirmed         { background: #1a2a4a; color: var(--accent); }
    .badge-strength-strong_inferred   { background: #1a2d3a; color: #67e8f9; }
    .badge-strength-moderate_inferred { background: #2a1f3a; color: var(--purple); }
    .badge-strength-weak_inferred     { background: #2a2a2a; color: var(--muted); }

    .badge-branch-structural { background: #1a2a1a; color: var(--green); }
    .badge-branch-contingent { background: #2a1a2a; color: var(--purple); }

    .badge-style-assertive  { background: #1a2a1a; color: #86efac; }
    .badge-style-qualifying { background: #2d2210; color: #fcd34d; }

    .badge-vol-small     { background: var(--surface2); color: var(--muted); }
    .badge-vol-good      { background: #1a2a1a; color: #6ee7b7; }
    .badge-vol-excellent { background: #1a2d1a; color: var(--green); }
    .badge-vol-capped    { background: #0d3320; color: var(--green); font-weight: 700; }

    .stale-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      background: var(--stale-bg);
      border: 1px solid var(--stale-border);
      color: var(--orange);
    }

    /* ── Empty state ── */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state h3 { font-size: 16px; margin-bottom: 6px; }

    /* ── Payer Profiles panel ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 28px 0 12px;
    }
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .profile-card .pname {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-card .currency-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1a2a4a;
      color: var(--accent);
      font-weight: 600;
    }
    .profile-card .conf-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #0d3320;
      color: var(--green);
    }
    .profile-card .pevidence {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .profile-card .psource {
      font-size: 11px;
      color: #5a6477;
      margin-top: 4px;
      font-style: italic;
    }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Loading / error ── */
    #loading { padding: 48px; text-align: center; color: var(--muted); }
    #error-msg { display: none; color: var(--red); padding: 16px; background: #2d1010; border-radius: 6px; margin-bottom: 16px; }
  </style>
</head>
<body>

<header>
  <h1>Niche Finder</h1>
  <p>UK business niches with hidden FX exposure — ranked by competition, mechanism strength, and volume</p>
</header>

<div class="container">
  <div id="loading">Loading niche data…</div>
  <div id="error-msg"></div>
  <div id="app" style="display:none"></div>
</div>

<script src="app.js"></script>
</body>
</html>
