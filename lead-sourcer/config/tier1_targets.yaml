# Job titles Hayvin wants to reach at each Tier 1 company. Used both to build
# LinkedIn people-search URLs and as a filter when parsing public reports for
# named contacts.
titles:
  - "Sustainability Manager"
  - "Head of ESG"
  - "ESG Manager"
  - "Waste & Compliance Manager"
  - "Environment Manager"
  - "Head of CSR"
  - "Regional Operations Manager"
  - "Sustainability Director"
