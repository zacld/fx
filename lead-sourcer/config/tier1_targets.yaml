# Tier 1 targets — major chains and forecourt groups.
#
# These are Hayvin's primary targets: a small, high-value, hand-curated list.
# Edit freely — add/remove companies or titles as the sales strategy changes.
#
# `domain` is used for email-pattern guessing and Hunter.io domain search.
# `search_names` are alternate names/aliases tried against public-report and
# press-page search (e.g. a group's press site sometimes uses the parent
# brand name rather than the trading name).

companies:
  - name: Tesco
    domain: tesco.com
    search_names: ["Tesco PLC", "Tesco Group"]
    press_url: "https://www.tescoplc.com/news/"
    sustainability_report_url: "https://www.tescoplc.com/sustainability/"

  - name: "Sainsbury's"
