# Fly.io config for the hayvin_lead_sourcer HTTP wrapper (server.py).
# Deploy from this directory: flyctl deploy
# This hosts the *trigger/status/CSV-download* API, not a scheduled job —
# nothing here runs the pipeline automatically. POST /run to kick off a run,
# poll GET /status, then GET /leads.csv once it's done.
#
# Secrets (set what you have — every key is optional except Companies House
# for Tier 2/3, and everything degrades gracefully if unset):
#   flyctl secrets set COMPANIES_HOUSE_API_KEY=...
#   flyctl secrets set HUNTER_API_KEY=...
#   flyctl secrets set TRIGGER_TOKEN=...   # recommended — guards POST /run

app            = "hayvin-lead-sourcer"
primary_region = "lhr"

[build]

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
